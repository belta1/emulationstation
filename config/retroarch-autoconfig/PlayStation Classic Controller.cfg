# Autoconfiguración de RetroArch: mando de PlayStation Classic (054c:0cda, USB).
# Sin sticks ni botón Guide: los atajos se hacen manteniendo Select.
#   Select + Start     = salir del juego y volver a EmulationStation
#   Select + Triángulo = menú de RetroArch
input_device = "Sony Interactive Entertainment Controller"
input_driver = "udev"
input_vendor_id = "1356"
input_product_id = "3290"

# Botones: posición física (RetroPad B = abajo = Cruz)
input_b_btn = "2"
input_a_btn = "1"
input_y_btn = "3"
input_x_btn = "0"
input_l_btn = "6"
input_r_btn = "7"
input_l2_btn = "4"
input_r2_btn = "5"
input_select_btn = "8"
input_start_btn = "9"

# Cruceta (el mando la envía como ejes)
input_up_axis = "-1"
input_down_axis = "+1"
input_left_axis = "-0"
input_right_axis = "+0"

# Atajos
input_enable_hotkey_btn = "8"
input_exit_emulator_btn = "9"
input_menu_toggle_btn = "0"

input_b_btn_label = "Cruz"
input_a_btn_label = "Círculo"
input_y_btn_label = "Cuadrado"
input_x_btn_label = "Triángulo"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_select_btn_label = "Select"
input_start_btn_label = "Start"
