# Autoconfiguración de RetroArch: Xbox One S por Bluetooth (045e:02fd, driver
# hid-microsoft, firmware 0903). La numeración tiene huecos: sale del
# descriptor HID del mando (datos de SDL_GameControllerDB, 050000005e040000fd02000003090000).
# View (Back) y Guide llegan como teclas de teclado (KEY_BACK, KEY_HOMEPAGE):
# RetroArch (1.18+) las cuenta después de los botones, como 15 y 16.
input_device = "Xbox Wireless Controller"
input_driver = "udev"
input_vendor_id = "1118"
input_product_id = "765"

# Botones: posición física (RetroPad B = abajo = A de Xbox)
input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "3"
input_x_btn = "4"
input_l_btn = "6"
input_r_btn = "7"
input_select_btn = "15"
input_start_btn = "11"
input_l3_btn = "13"
input_r3_btn = "14"
input_l2_axis = "+5"
input_r2_axis = "+4"

# Cruceta
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# Sticks analógicos
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

# Botón Guide (Xbox) = salir del juego y volver a EmulationStation
input_exit_emulator_btn = "16"

input_b_btn_label = "A"
input_a_btn_label = "B"
input_y_btn_label = "X"
input_x_btn_label = "Y"
input_l_btn_label = "LB"
input_r_btn_label = "RB"
input_l2_axis_label = "LT"
input_r2_axis_label = "RT"
input_select_btn_label = "Back"
input_start_btn_label = "Start"
