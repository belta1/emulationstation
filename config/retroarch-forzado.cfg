# Ajustes de RetroArch que se aplican en cada partida (es-retroarch los añade
# con --appendconfig), por encima de ~/.config/retroarch/retroarch.cfg. Así se
# cumplen aunque el retroarch.cfg del volumen sea de una versión anterior.

# Con RetroArch 1.18 (Ubuntu 24.04) el vsync funciona con GNOME en Wayland.
# (El 1.7.3 de Ubuntu 22.04 se congelaba y había que desactivarlo.)
video_vsync = "true"

# Stick izquierdo = cruceta en todos los juegos. En modo 1, RetroArch lo
# desactiva solo cuando el núcleo usa el stick analógico (N64, por ejemplo).
input_player1_analog_dpad_mode = "1"
input_player2_analog_dpad_mode = "1"

# Menú de RetroArch: A de Xbox (botón inferior) acepta, B vuelve
menu_swap_ok_cancel_buttons = "true"

# Remapeos por núcleo incluidos en la imagen (NES: X = B, A = A)
input_remapping_directory = "/etc/retroarch/remaps"
auto_remaps_enable = "true"
