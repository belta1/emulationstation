# Ajustes de RetroArch que se aplican en cada partida (es-retroarch los añade
# con --appendconfig), por encima de ~/.config/retroarch/retroarch.cfg.
# Sin vsync: con GNOME en Wayland (Xwayland) el vsync de GLX
# (OML_sync_control) se queda esperando para siempre y el juego se congela en
# el primer fotograma. El compositor ya evita el tearing y audio_sync mantiene
# la velocidad.
video_vsync = "false"
