<?xml version="1.0"?>
<!-- Sistemas de EmulationStation. Las ROMs van en /roms/<sistema>. -->
<!-- Los núcleos libretro se enlazan en /usr/lib/libretro (ver Dockerfile). -->
<!-- Se instala en /etc/emulationstation/es_systems.cfg. Para personalizarlo, copia
     este archivo a ~/.emulationstation/es_systems.cfg (volumen es-config): ES usa
     esa copia en lugar de la de /etc. -->
<systemList>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>/roms/nes</path>
    <extension>.nes .NES .zip .ZIP .7z</extension>
    <command>retroarch -f -L /usr/lib/libretro/fceumm_libretro.so %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
  </system>
  <system>
    <name>snes</name>
    <fullname>Super Nintendo</fullname>
    <path>/roms/snes</path>
    <extension>.smc .sfc .SMC .SFC .zip .ZIP .7z</extension>
    <command>retroarch -f -L /usr/lib/libretro/snes9x_libretro.so %ROM%</command>
    <platform>snes</platform>
    <theme>snes</theme>
  </system>
  <system>
    <name>gb</name>
    <fullname>Game Boy</fullname>
    <path>/roms/gb</path>
    <extension>.gb .GB .zip .ZIP .7z</extension>
    <command>retroarch -f -L /usr/lib/libretro/gambatte_libretro.so %ROM%</command>
    <platform>gb</platform>
    <theme>gb</theme>
  </system>
  <system>
    <name>gbc</name>
    <fullname>Game Boy Color</fullname>
    <path>/roms/gbc</path>
    <extension>.gbc .GBC .zip .ZIP .7z</extension>
    <command>retroarch -f -L /usr/lib/libretro/gambatte_libretro.so %ROM%</command>
    <platform>gbc</platform>
    <theme>gbc</theme>
  </system>
  <system>
    <name>gba</name>
    <fullname>Game Boy Advance</fullname>
    <path>/roms/gba</path>
    <extension>.gba .GBA .zip .ZIP .7z</extension>
    <command>retroarch -f -L /usr/lib/libretro/mgba_libretro.so %ROM%</command>
    <platform>gba</platform>
    <theme>gba</theme>
  </system>
  <system>
    <name>megadrive</name>
    <fullname>Sega Mega Drive / Genesis</fullname>
    <path>/roms/megadrive</path>
    <extension>.md .MD .gen .GEN .bin .BIN .smd .SMD .zip .ZIP .7z</extension>
    <command>retroarch -f -L /usr/lib/libretro/genesis_plus_gx_libretro.so %ROM%</command>
    <platform>megadrive</platform>
    <theme>megadrive</theme>
  </system>
  <system>
    <name>mastersystem</name>
    <fullname>Sega Master System</fullname>
    <path>/roms/mastersystem</path>
    <extension>.sms .SMS .zip .ZIP .7z</extension>
    <command>retroarch -f -L /usr/lib/libretro/genesis_plus_gx_libretro.so %ROM%</command>
    <platform>mastersystem</platform>
    <theme>mastersystem</theme>
  </system>
  <system>
    <name>n64</name>
    <fullname>Nintendo 64</fullname>
    <path>/roms/n64</path>
    <extension>.n64 .N64 .z64 .Z64 .v64 .V64 .zip .ZIP</extension>
    <command>retroarch -f -L /usr/lib/libretro/mupen64plus_libretro.so %ROM%</command>
    <platform>n64</platform>
    <theme>n64</theme>
  </system>
  <system>
    <name>psx</name>
    <fullname>Sony PlayStation</fullname>
    <path>/roms/psx</path>
    <extension>.cue .CUE .chd .CHD .pbp .PBP .m3u .M3U</extension>
    <command>retroarch -f -L /usr/lib/libretro/mednafen_psx_libretro.so %ROM%</command>
    <platform>psx</platform>
    <theme>psx</theme>
  </system>
  <system>
    <name>pcengine</name>
    <fullname>PC Engine / TurboGrafx-16</fullname>
    <path>/roms/pcengine</path>
    <extension>.pce .PCE .cue .CUE .zip .ZIP</extension>
    <command>retroarch -f -L /usr/lib/libretro/mednafen_pce_fast_libretro.so %ROM%</command>
    <platform>pcengine</platform>
    <theme>pcengine</theme>
  </system>
  <system>
    <name>arcade</name>
    <fullname>Arcade</fullname>
    <path>/roms/arcade</path>
    <extension>.zip .ZIP .7z .7Z</extension>
    <command>retroarch -f -L /usr/lib/libretro/fbneo_libretro.so %ROM%</command>
    <platform>arcade</platform>
    <theme>arcade</theme>
  </system>
  <!-- Siempre tiene entradas, así EmulationStation arranca aunque no haya ROMs. -->
  <system>
    <name>herramientas</name>
    <fullname>Herramientas</fullname>
    <path>/opt/es-tools</path>
    <extension>.sh</extension>
    <command>bash %ROM%</command>
    <platform>ignore</platform>
    <theme>retropie</theme>
  </system>
</systemList>
