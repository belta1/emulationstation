# Configuración mínima de RetroArch dentro del contenedor.
# Se copia a ~/.config/retroarch/retroarch.cfg solo en el primer arranque.
libretro_directory = "/usr/lib/libretro"
system_directory = "/roms/bios"
savefile_directory = "~/.config/retroarch/saves"
savestate_directory = "~/.config/retroarch/states"
screenshot_directory = "~/.config/retroarch/screenshots"
video_driver = "gl"
video_fullscreen = "true"
audio_driver = "pulse"
menu_driver = "rgui"
config_save_on_exit = "true"
# Teclado: Esc sale del juego y vuelve a EmulationStation, F1 abre el menú
input_exit_emulator = "escape"
input_menu_toggle = "f1"
input_player1_a = "x"
input_player1_b = "z"
input_player1_x = "s"
input_player1_y = "a"
input_player1_l = "q"
input_player1_r = "w"
input_player1_start = "enter"
input_player1_select = "rshift"
input_player1_up = "up"
input_player1_down = "down"
input_player1_left = "left"
input_player1_right = "right"

# Mandos: 2 jugadores con autoconfiguración (perfiles de Xbox 360 incluidos
# en /etc/retroarch/autoconfig). Requiere pasar /dev/input y /run/udev.
input_joypad_driver = "udev"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/etc/retroarch/autoconfig"
input_max_users = "2"
input_player1_joypad_index = "0"
input_player2_joypad_index = "1"
input_player1_analog_dpad_mode = "0"
input_player2_analog_dpad_mode = "0"
all_users_control_menu = "true"
# Botón Guide (Xbox) = salir del juego y volver a EmulationStation
input_exit_emulator_btn = "8"
# L3 + R3 (pulsar ambos sticks) = menú de RetroArch
input_menu_toggle_gamepad_combo = "2"
