<?xml version="1.0"?>
<!-- Ajustes de EmulationStation para gastar menos CPU/GPU. Se copia a
     ~/.emulationstation/es_settings.cfg solo en el primer arranque; después
     EmulationStation lo reescribe con lo que se cambie desde sus menús. -->
<bool name="BackgroundJoystickInput" value="false" />
<int name="MaxVRAM" value="128" />
<int name="ScreenSaverTime" value="300000" />
<!-- "default": ES duerme entre eventos en vez de redibujar sin parar -->
<string name="PowerSaverMode" value="default" />
<string name="ScreenSaverBehavior" value="black" />
<string name="TransitionStyle" value="instant" />
<string name="SaveGamelistsMode" value="on exit" />
